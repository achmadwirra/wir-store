<svg width="1200" height="630" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#030712;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#0a0a1a;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#030712;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="amber" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f59e0b;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#d97706;stop-opacity:1" />
    </linearGradient>
    <radialGradient id="glow" cx="70%" cy="30%" r="50%">
      <stop offset="0%" style="stop-color:#f59e0b;stop-opacity:0.15" />
      <stop offset="100%" style="stop-color:#f59e0b;stop-opacity:0" />
    </radialGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#glow)"/>
  <!-- Logo -->
  <rect x="520" y="180" width="64" height="64" rx="14" fill="url(#amber)"/>
  <text x="552" y="228" font-family="Arial, sans-serif" font-size="36" font-weight="bold" fill="#030712" text-anchor="middle">W</text>
  <!-- Title -->
  <text x="600" y="310" font-family="Arial, sans-serif" font-size="52" font-weight="bold" fill="#ffffff" text-anchor="middle">Wir<tspan fill="#f59e0b">Store</tspan></text>
  <!-- Subtitle -->
  <text x="600" y="360" font-family="Arial, sans-serif" font-size="22" fill="#9ca3af" text-anchor="middle">Premium Online Shopping</text>
  <!-- Tagline -->
  <text x="600" y="410" font-family="Arial, sans-serif" font-size="16" fill="#6b7280" text-anchor="middle">Quality meets design in every item we offer</text>
  <!-- Border -->
  <rect x="0" y="0" width="1200" height="630" fill="none" stroke="#f59e0b" stroke-opacity="0.2" stroke-width="2"/>
</svg>
